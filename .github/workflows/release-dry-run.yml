name: Release dry-run

# Validates the release pipeline (builds, artifact upload/download + gh release) against
# the pinned tool and action versions WITHOUT publishing: creates a draft GitHub release
# and skips crates.io and Homebrew.
# Trigger by pushing a tag like `test-v2.8.6`

on:
  push:
    tags:
      - test-v*

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [
          x86_64-unknown-linux-musl,
          aarch64-unknown-linux-musl,
          armv7-unknown-linux-musleabihf
        ]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install cross
        run: cargo install cross

      - name: Build with cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/leadr dist/leadr-${{ github.ref_name }}-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: leadr-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/leadr-${{ github.ref_name }}-${{ matrix.target }}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (macOS)
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/leadr dist/leadr-${{ github.ref_name }}-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: leadr-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/leadr-${{ github.ref_name }}-${{ matrix.target }}

  draft-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Inspect downloaded assets
        run: |
          ls -lR dist
          file dist/* || true

      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --prerelease \
            --title "DRY RUN $GITHUB_REF_NAME" \
            --notes "TEST RELEASE | DELETE LATER" \
            --generate-notes
